version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WCD_URL=${WCD_URL}
      - WCD_API_KEY=${WCD_API_KEY}
      - BASE_MODEL=${BASE_MODEL}
      - BASE_PROVIDER=${BASE_PROVIDER}
      - COMPLEX_MODEL=${COMPLEX_MODEL}
      - COMPLEX_PROVIDER=${COMPLEX_PROVIDER}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEAVIATE_IS_LOCAL=${WEAVIATE_IS_LOCAL}
      - FIRST_START_ELYSIA=${FIRST_START_ELYSIA}
    restart: always

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
