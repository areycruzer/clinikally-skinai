version: '3.8'

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.29.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-google'
      ENABLE_MODULES: 'text2vec-google'
      CLUSTER_HOSTNAME: 'node1'
      GOOGLE_APIKEY: ${GEMINI_API_KEY}

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WCD_URL=${WCD_URL}
      - WCD_API_KEY=${WCD_API_KEY}
      - BASE_MODEL=${BASE_MODEL}
      - BASE_PROVIDER=${BASE_PROVIDER}
      - COMPLEX_MODEL=${COMPLEX_MODEL}
      - COMPLEX_PROVIDER=${COMPLEX_PROVIDER}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WEAVIATE_IS_LOCAL=${WEAVIATE_IS_LOCAL}
      - FIRST_START_ELYSIA=${FIRST_START_ELYSIA}
    restart: always
    depends_on:
      - weaviate

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
  weaviate_data:
