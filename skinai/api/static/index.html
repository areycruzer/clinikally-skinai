  /* Import premium typography */
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

  /* Skincare Spa Pastel Theme Overrides */
  :root {
    --background: 28 40% 95% !important; /* Warm cream #f8f1eb */
    --background_alt: 192 27% 93% !important; /* Soft pastel green-blue #e8f0f2 */
    --foreground: 160 17% 13% !important; /* Charcoal-forest green #1a2522 */
    --foreground_alt: 192 27% 90% !important;
    --primary: 160 17% 13% !important; /* Charcoal-forest green #1a2522 */
    --secondary: 157 11% 40% !important; /* Sage-slate #556660 */
    --accent: 149 33% 26% !important; /* Clinikally signature deep green #2D5A43 */
    --background_accent: 149 20% 90% !important; /* Soft green */
    --border: 162 17% 85% !important; /* Soft sage border #d2dfdb */
    --card: 0 0% 100% !important;
    --card-foreground: 160 17% 13% !important;
    --popover: 0 0% 100% !important;
    --popover-foreground: 160 17% 13% !important;
    --primary-foreground: 160 17% 13% !important;
    --secondary-foreground: 160 17% 13% !important;
    --muted: 192 27% 93% !important;
    --muted-foreground: 157 11% 40% !important;
    --accent-foreground: 160 17% 13% !important;
    --radius: 1rem !important;
    --sidebar: 192 27% 93% !important;
    --sidebar-foreground: 160 17% 13% !important;
    --sidebar-primary: 149 33% 26% !important;
    --sidebar-primary-foreground: 0 0% 100% !important;
    --sidebar-accent: 149 20% 90% !important;
    --sidebar-accent-foreground: 160 17% 13% !important;
    --sidebar-border: 162 17% 85% !important;
  }

  /* Standard base text color */
  body {
    color: hsl(var(--foreground));
  }

  /* Ensure solid white colors inside active dark elements (user bubbles, primary buttons, accent backgrounds) and their descendants */
  .bg-primary, .bg-primary *,
  .bg-accent, .bg-accent *,
  button.bg-primary, button.bg-primary *,
  .bg-emerald-700, .bg-emerald-700 *,
  .bg-emerald-600, .bg-emerald-600 *,
  .bg-emerald-500, .bg-emerald-500 *,
  .bg-sidebar-primary, .bg-sidebar-primary * {
    color: #ffffff !important;
  }

  /* By default, override all white/light texts to be dark on cream pages */
  .text-white, .text-slate-50, .text-slate-100, .text-slate-200, .text-slate-300,
  .text-zinc-50, .text-zinc-100, .text-zinc-200, .text-gray-100, .text-gray-200 {
    color: hsl(var(--foreground)) !important;
  }

  /* Specific legibility override for headings and Related Questions sections outside primary bubbles */
  .related-questions, .related-questions *, 
  h1, h2, h3, h4, h5, h6 {
    color: hsl(var(--foreground)) !important;
  }
  
  /* Make sure headings inside primary/accent bubbles remain crisp white */
  .bg-primary h1, .bg-primary h2, .bg-primary h3, .bg-primary h4, .bg-primary h5, .bg-primary h6,
  .bg-accent h1, .bg-accent h2, .bg-accent h3, .bg-accent h4, .bg-accent h5, .bg-accent h6 {
    color: #ffffff !important;
  }

  /* Beautiful keyword highlight styling on light background */
  mark {
    background-color: hsla(45, 100%, 50%, 0.25) !important;
    color: hsl(var(--accent)) !important;
    font-weight: 600 !important;
    padding: 0 4px !important;
    border-radius: 4px !important;
  }

  /* Global font setting */
  body, input, button, textarea, select {
    font-family: 'Outfit', sans-serif !important;
  }

  /* Make standard chat layout look incredibly premium */
  main {
    background-color: hsl(var(--background)) !important;
  }

  /* Fix overlap: ensure chat messages don't render behind the fixed input bar + status */
  .flex.flex-col.w-full.overflow-scroll,
  .flex.flex-col.gap-4,
  .flex.flex-col.gap-5 {
    padding-bottom: 140px !important;
  }

  /* Give the fixed input bar area a solid background so text doesn't bleed through */
  .fixed.bottom-8 {
    background-color: hsl(var(--background)) !important;
    padding-top: 12px !important;
    padding-bottom: 0 !important;
    bottom: 0 !important;
    padding-bottom: 2rem !important;
  }

  /* Pulsing status text above input: ensure it's readable with a clear background */
  .fixed.bottom-8 > .flex.justify-between {
    background-color: hsl(var(--background)) !important;
    padding: 4px 8px !important;
    border-radius: 8px !important;
  }

  /* Rounded chat bubble refinements */
  .bg-foreground {
    background-color: #ffffff !important;
    color: hsl(var(--primary)) !important;
    border: 1px solid hsl(var(--border)) !important;
    box-shadow: 0 4px 15px rgba(45, 90, 67, 0.02) !important;
    border-radius: 1.25rem !important;
  }

  /* User chat bubble styling - rich signature deep green with white text */
  .bg-primary {
    background-color: hsl(var(--accent)) !important;
    color: #ffffff !important;
    border-radius: 1.25rem !important;
    box-shadow: 0 4px 15px rgba(45, 90, 67, 0.1) !important;
  }
  
  /* Highlighted/marked search keywords inside user bubble popping clearly */
  .bg-primary mark, .bg-primary .highlight, .bg-primary mark *, .bg-primary .highlight * {
    background-color: rgba(255, 255, 255, 0.3) !important;
    color: #ffffff !important;
    font-weight: 700 !important;
    padding: 0 4px !important;
    border-radius: 4px !important;
    display: inline-block !important;
  }

  /* Sidebar styling */
  aside, [role="navigation"], .bg-sidebar {
    background-color: hsl(var(--background_alt)) !important;
    border-right: 1px solid hsl(var(--border)) !important;
  }

  /* Header and panels */
  header, .border-b {
    background-color: hsl(var(--background)) !important;
    border-color: hsl(var(--border)) !important;
  }

  /* Input form area refinements */
  textarea {
    border: 1px solid hsl(var(--border)) !important;
    background-color: #ffffff !important;
    color: hsl(var(--primary)) !important;
    border-radius: 1rem !important;
    box-shadow: 0 10px 30px -10px rgba(45, 90, 67, 0.05) !important;
    padding: 0.875rem 1.25rem !important;
    transition: all 0.2s ease !important;
  }
  textarea:focus {
    border-color: hsl(var(--accent)) !important;
    outline: none !important;
    box-shadow: 0 10px 30px -10px rgba(45, 90, 67, 0.1) !important;
  }

  /* Send button styling */
  button.bg-primary {
    background-color: hsl(var(--accent)) !important;
    color: #ffffff !important;
    border-radius: 0.75rem !important;
    transition: all 0.2s ease !important;
  }
  button.bg-primary:hover {
    background-color: hsla(149, 38%, 22%, 1) !important;
    transform: translateY(-1px);
  }

  /* High-end Clinikally Scrollbar */
  ::-webkit-scrollbar {
    width: 6px !important;
    height: 6px !important;
  }
  ::-webkit-scrollbar-track {
    background-color: transparent !important;
  }
  ::-webkit-scrollbar-thumb {
    background-color: hsl(var(--accent)/0.15) !important;
    border-radius: 9999px !important;
    border: 1px solid transparent !important;
  }
  ::-webkit-scrollbar-thumb:hover {
    background-color: hsl(var(--accent)/0.3) !important;
  }

  /* Beautiful Table styling in Markdown */
  table {
    border-collapse: collapse !important;

<script>
  (function() {
    console.log("Clinikally Skincare AI Custom Hydration Loaded! ✨");

    // Automatically dismiss the Clinikally SkinAI welcome modal
    localStorage.setItem('ELYSIA_START_DIALOG_DONT_SHOW_AGAIN', 'true');
    localStorage.setItem('dont_show_rate_limit_dialog', 'true');
    localStorage.setItem('dont_show_dialog', 'true');

    // Hide settings, setup, blob, documentation, and powered by weaviate from UI
    setInterval(function() {
      var elements = document.querySelectorAll('button, a, span, p, div, li, [data-sidebar="menu-button"]');
      elements.forEach(function(el) {
        var txt = el.textContent || el.innerText;
        if (txt) {
          var cleanTxt = txt.trim().toLowerCase();
          if (
            cleanTxt === 'settings' || 
            cleanTxt === 'setup skinai' || 
            cleanTxt === 'blob' || 
            cleanTxt === 'documentation' || 
            cleanTxt === 'powered by weaviate'
          ) {
            var container = el.closest('li') || el;
            container.style.setProperty('display', 'none', 'important');
          }
        }
      });
      if (window.location.search.indexOf('page=settings') !== -1) {
        window.location.href = window.location.origin + window.location.pathname;
      }
    }, 50);

    const OriginalWebSocket = window.WebSocket;

    // ======== LIVE SERVER LOGS TO CONSOLE ========
    (function connectLogsWS() {
      var wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      var wsHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0'
        ? window.location.host
        : (localStorage.getItem('clinikally_backend_host') || '65.20.71.161.nip.io');
      
      var wsUrl = wsProtocol + '//' + wsHost + '/api/logs';
      
      var logWs = new OriginalWebSocket(wsUrl);
      logWs.onmessage = function(event) {
        console.log("%c[Backend Log]%c " + event.data, "color: #2D5A43; font-weight: bold;", "color: #4A5568; font-family: monospace;");
      };
      logWs.onclose = function() {
        setTimeout(connectLogsWS, 5000);
      };
      logWs.onerror = function() {
        logWs.close();
      };
    })();

    // ======== BONUS: CONVERSATION PERSISTENCE ========
    let sessionUserId = localStorage.getItem('clinikally_user_id');
    let sessionConvId = localStorage.getItem('clinikally_conv_id');
    if (!sessionUserId) {
      sessionUserId = crypto.randomUUID();
      localStorage.setItem('clinikally_user_id', sessionUserId);
    }
    if (!sessionConvId) {
      sessionConvId = crypto.randomUUID();
      localStorage.setItem('clinikally_conv_id', sessionConvId);
    }
    window.sessionUserId = sessionUserId;
    window.sessionConvId = sessionConvId;
    window.lastQueryId = "";

    // Reverse-lookup maps: intercepted backend IDs → original React-generated IDs
    // so incoming WebSocket messages can be rewritten back for React state matching.
    const _convIdMap = {};   // backend conversation_id → React conversation_id
    const _userIdMap = {};   // backend user_id → React user_id

    // Detect if we should rewrite URLs to a remote production backend
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '0.0.0.0';
    const remoteBackendHost = localStorage.getItem('clinikally_backend_host') || '65.20.71.161.nip.io';

    window.WebSocket = function(url, protocols) {
      if (!isLocal) {
        try {
          const urlObj = new URL(url);
          urlObj.protocol = urlObj.protocol === 'wss:' || urlObj.protocol === 'https:' ? 'wss:' : 'ws:';
          urlObj.host = remoteBackendHost;
          url = urlObj.toString();
        } catch (e) {
          console.error('[SkinAI Interceptor] WebSocket URL rewrite failed:', e);
        }
      }
      console.log('[SkinAI Interceptor] 🔌 WebSocket created for:', url);
      const ws = new OriginalWebSocket(url, protocols);
      const originalSend = ws.send;
      ws.send = function(data) {
        if (typeof data === 'string') {
          try {
            const parsed = JSON.parse(data);

            // Save the original React-generated IDs BEFORE overwriting
            const origConvId = parsed.conversation_id;
            const origUserId = parsed.user_id;

            if (parsed.user_id) parsed.user_id = window.sessionUserId;
            if (parsed.conversation_id) parsed.conversation_id = window.sessionConvId;
            if (parsed.query_id) window.lastQueryId = parsed.query_id;

            // Build reverse map: backend ID → original React ID
            if (origConvId && parsed.conversation_id !== origConvId) {
              _convIdMap[parsed.conversation_id] = origConvId;
              console.log('[SkinAI Interceptor] 📤 SEND: conv_id mapped', origConvId, '→', parsed.conversation_id);
            }
            if (origUserId && parsed.user_id !== origUserId) {
              _userIdMap[parsed.user_id] = origUserId;
              console.log('[SkinAI Interceptor] 📤 SEND: user_id mapped', origUserId, '→', parsed.user_id);
            }
            
            // Attach the uploaded skin photo base64 payload if it exists!
            if (window.lastUploadedImageBase64) {
              parsed.image = window.lastUploadedImageBase64;
              window.currentSendingImage = window.lastUploadedImageBase64;
              window.lastUploadedImageBase64 = null;
              
              // Clear preview UI
              const previewContainer = document.getElementById('skin-image-preview-container');
              if (previewContainer) {
                previewContainer.style.display = 'none';
                previewContainer.innerHTML = '';
              }
              const fileInput = document.getElementById('skin-image-input');
              if (fileInput) fileInput.value = '';
            }
            
            data = JSON.stringify(parsed);
          } catch(e) {}
        }
        return originalSend.call(this, data);
      };

      // ---- Incoming message rewriter ----
      // Intercept all incoming WS messages to swap backend IDs back to
      // React-generated IDs so the ConversationProvider state lookup succeeds.
      function rewriteIncomingData(rawData) {
        if (typeof rawData !== 'string') return rawData;
        try {
          const parsed = JSON.parse(rawData);
          let changed = false;

          // Swap conversation_id back to original React ID
          if (parsed.conversation_id && _convIdMap[parsed.conversation_id]) {
            const oldId = parsed.conversation_id;
            parsed.conversation_id = _convIdMap[parsed.conversation_id];
            changed = true;
            console.log('[SkinAI Interceptor] 📥 RECV: conv_id rewritten', oldId.slice(0,8), '→', parsed.conversation_id.slice(0,8), 'type:', parsed.type);
          }
          // Swap user_id back to original React ID
          if (parsed.user_id && _userIdMap[parsed.user_id]) {
            parsed.user_id = _userIdMap[parsed.user_id];
            changed = true;
          }

          if (changed) return JSON.stringify(parsed);
        } catch(e) {}
        return rawData;
      }

      // Proxy the onmessage setter to intercept the React handler
      let _onmessage = null;
      Object.defineProperty(ws, 'onmessage', {
        get() { return _onmessage; },
        set(handler) {
          _onmessage = handler;
          // Do nothing here — we handle dispatch in the native listener below
        }
      });

      // Single native listener that rewrites data, then dispatches to both
      // the onmessage handler and our custom NER/highlight logic.
      const _eventListeners = [];
      const origAddEventListener = ws.addEventListener.bind(ws);
      ws.addEventListener = function(type, handler, options) {
        if (type === 'message') {
          _eventListeners.push(handler);
        } else {
          origAddEventListener(type, handler, options);
        }
      };

      // The ONE real native listener — rewrites data, then fans out
      origAddEventListener('message', function(event) {
        const rewritten = rewriteIncomingData(event.data);
        // Create a synthetic event-like object with the rewritten data
        const proxy = new Proxy(event, {
          get(target, prop) {
            if (prop === 'data') return rewritten;
            let val = target[prop];
            if (typeof val === 'function') return val.bind(target);
            return val;
          }
        });

        // Dispatch to React's onmessage handler (SocketProvider)
        if (_onmessage) {
          try { _onmessage(proxy); } catch(e) { console.error('onmessage error', e); }
        }

        // Dispatch to all addEventListener('message', ...) handlers
        _eventListeners.forEach(fn => {
          try { fn(proxy); } catch(e) {}
        });
      });

      // Register our custom NER/highlight handler as an _eventListener:
      _eventListeners.push(function(event) {
        try {
          const parsed = JSON.parse(event.data);
          if (parsed.query_id) window.lastQueryId = parsed.query_id;
          
          if (parsed.type === 'ner' && parsed.payload) {
            const { text, entity_spans, noun_spans } = parsed.payload;
            if (text) {
              setTimeout(() => {
                const userBubbles = Array.from(document.querySelectorAll('.bg-primary'));
                userBubbles.forEach(bubble => {
                  let bubbleText = bubble.textContent || bubble.innerText;
                  if (bubbleText.trim().replace(/\s+/g, ' ').includes(text.trim().replace(/\s+/g, ' '))) {
                    const spans = [...(entity_spans || []), ...(noun_spans || [])];
                    if (spans.length === 0) return;
                    spans.sort((a, b) => a[0] - b[0]);
                    const mergedSpans = [];
                    spans.forEach(span => {
                      if (mergedSpans.length === 0) { mergedSpans.push(span); }
                      else {
                        const last = mergedSpans[mergedSpans.length - 1];
                        if (span[0] < last[1]) { last[1] = Math.max(last[1], span[1]); }
                        else { mergedSpans.push(span); }
                      }
                    });
                    let html = '';
                    let lastIdx = 0;
                    mergedSpans.forEach(span => {
                      const start = span[0]; const end = span[1];
                      if (start >= lastIdx && end <= text.length) {
                        html += text.substring(lastIdx, start);
                        html += `<mark class="highlight">${text.substring(start, end)}</mark>`;
                        lastIdx = end;
                      }
                    });
                    html += text.substring(lastIdx);
                    
                    // Keep original uploaded image container if exists
                    const uploadedImg = bubble.querySelector('.clinikally-uploaded-img');
                    bubble.innerHTML = html;
                    if (uploadedImg) { bubble.appendChild(uploadedImg); }
                  }
                });
              }, 100);
            }
          }
        } catch(e) {}
      });
      
      return ws;
    };
    window.WebSocket.prototype = OriginalWebSocket.prototype;
    
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
      let [resource, config] = args;
      if (typeof resource === 'string') {
        try {
          const urlObj = new URL(resource, window.location.origin);
          let pathname = urlObj.pathname;
          
          if (pathname.includes('/init/user/')) {
            pathname = pathname.replace(/(\/init\/user\/)[^\/?#]+/, '$1' + window.sessionUserId);
          } else if (pathname.includes('/init/tree/')) {
            const match = pathname.match(/\/init\/tree\/[^\/]+\/([^\/?#]+)/);
            if (match && match[1]) {
              window.sessionConvId = match[1];
              localStorage.setItem('clinikally_conv_id', match[1]);
              console.log('[SkinAI Interceptor] 📁 Active conversation updated (init):', match[1]);
            }
            pathname = pathname.replace(/(\/init\/tree\/)[^\/]+(\/)[^\/?#]+/, '$1' + window.sessionUserId + '$2' + window.sessionConvId);
          } else if (pathname.includes('/query/')) {
            pathname = pathname.replace(/(\/query\/)[^\/]+(\/)[^\/?#]+/, '$1' + window.sessionUserId + '$2' + window.sessionConvId);
          } else if (pathname.includes('/db/')) {
            pathname = pathname.replace(/(\/db\/)[^\/]+/, '$1' + window.sessionUserId);
            if (pathname.includes('/load_tree/')) {
              const match = pathname.match(/\/load_tree\/([^\/?#]+)/);
              if (match && match[1]) {
                window.sessionConvId = match[1];
                localStorage.setItem('clinikally_conv_id', match[1]);
                console.log('[SkinAI Interceptor] 📁 Active conversation updated (load):', match[1]);
              }
            }
          }
          
          urlObj.pathname = pathname;
          
          if (!isLocal) {
            urlObj.protocol = 'https:';
            urlObj.host = remoteBackendHost;
            resource = urlObj.toString();
          } else {
            resource = resource.startsWith('/') ? urlObj.pathname + urlObj.search + urlObj.hash : urlObj.toString();
          }
        } catch(e) {
          console.error('[SkinAI Interceptor] Fetch rewrite failed:', e);
        }
      }
      return originalFetch(resource, config);
    };

    // ======== BONUS: USER FEEDBACK MECHANISM ========
    window.submitFeedback = async function(btn, value) {
      const qid = window.lastQueryId || crypto.randomUUID();
      btn.innerHTML = value === 1 ? '✅' : '❌';
      btn.disabled = true;
      try {
        const feedbackUrl = isLocal ? 'http://localhost:8000/feedback/add' : `https://${remoteBackendHost}/feedback/add`;
        await originalFetch(feedbackUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: window.sessionUserId,
            conversation_id: window.sessionConvId,
            query_id: qid,
            feedback: value
          })
        });
      } catch(e) {
        console.error("Feedback error", e);
      }
    };

    // Helper functions for badge colors
    function getBadgeHtml(suitability) {
      if (!suitability) return '';
      return suitability.split(',').map(s => {
        const text = s.trim();
        const type = text.toLowerCase();
        let classes = 'bg-gray-100 text-gray-700'; // Default
        
        if (type.includes('oily')) {
          classes = 'bg-emerald-50 text-emerald-700 border border-emerald-100';
        } else if (type.includes('dry')) {
          classes = 'bg-blue-50 text-blue-700 border border-blue-100';
        } else if (type.includes('sensitive')) {
          classes = 'bg-rose-50 text-rose-700 border border-rose-100';
        } else if (type.includes('combination')) {
          classes = 'bg-purple-50 text-purple-700 border border-purple-100';
        } else if (type.includes('acne')) {
          classes = 'bg-amber-50 text-amber-700 border border-amber-100';
        }
        
        return `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${classes}">${text}</span>`;
      }).join(' ');
    }

    // Product parser
    function parseProducts(text) {
      const products = [];
      const parts = text.split(/---|### Recommended Moisturisers|### How to Choose/i);
      
      parts.forEach(part => {
        const nameMatch = part.match(/(?:####\s*\*\*|\*\*|###\s*\*\*|####\s*)([^*#\n]+)(?:\*\*|\n)/i);
        const priceMatch = part.match(/\*\*Price:\*\*\s*(?:₹|\$)?\s*([0-9,]+)/i);
        const skinMatch = part.match(/\*\*Skin Suitability:\*\*\s*([^\n]+)/i);
        const linkMatch = part.match(/\[View Product\]\(([^)]+)\)/i);
        
        if (nameMatch && (priceMatch || skinMatch || linkMatch)) {
          const name = nameMatch[1].trim();
          const price = priceMatch ? '₹' + priceMatch[1].trim() : '';
          const suitability = skinMatch ? skinMatch[1].trim() : '';
          const url = linkMatch ? linkMatch[1].trim() : '#';
          
          // Extract benefits
          const benefits = [];
          const lines = part.split('\n');
          lines.forEach(line => {
            const trimmed = line.trim();
            if (trimmed.startsWith('-') || trimmed.startsWith('*')) {
              const benefit = trimmed.substring(1).trim().replace(/\*\*|__/g, '');
              if (benefit) benefits.push(benefit);
            }
          });
          
          products.push({ name, price, suitability, benefits, url });
        }
      });
      
      return products;
    }

        sourceBadge = `
          <div class="clinikally-attribution mt-4 pt-3 border-t border-border flex items-center justify-between text-xs text-secondary font-semibold">
            <span class="flex items-center gap-1.5 text-amber-700">
              <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
              Sourced from General Knowledge
            </span>
            <span class="opacity-65 flex items-center gap-3">
              <span class="flex items-center gap-1.5 border-r border-border pr-3">
                <button onclick="window.submitFeedback(this, 1)" class="hover:scale-110 transition-transform" title="Helpful">👍</button>
                <button onclick="window.submitFeedback(this, -1)" class="hover:scale-110 transition-transform" title="Not Helpful">👎</button>
              </span>
              💡 Skincare Expert
            </span>
          </div>
        `;
      }
      
      bubble.insertAdjacentHTML('beforeend', sourceBadge);
    }

    // Format links and sources beautifully
    function formatLinksAndSources(bubble, rawText) {
      const links = Array.from(bubble.querySelectorAll('a'));
      const blogLinks = [];
      
      links.forEach(link => {
        const url = link.href || '';
        const text = link.textContent || '';
        
        if (url.includes('/blogs/') || url.includes('blog') || text.toLowerCase().includes('article') || text.toLowerCase().includes('read the full')) {
          blogLinks.push({
            url,
            title: text.replace(/\[|\]/g, '').replace('Read the full article', '').trim() || 'Skincare Article'
          });
          link.style.display = 'none'; // hide original link
        }
      });
      
      if (blogLinks.length > 0) {
        let sourcesHtml = `
          <div class="mt-4 pt-3 border-t border-border/60">
            <div class="text-xs font-bold text-secondary mb-2 uppercase tracking-wider opacity-75">Related Guides & Clinical Articles:</div>
            <div class="grid grid-cols-1 gap-2">
        `;
        
        blogLinks.forEach(b => {
          let title = b.title;
          if (title === 'Skincare Article') {
            const titleMatch = rawText.match(/\*\*“([^”]+)”\*\*/);
            if (titleMatch) title = titleMatch[1];
          }
          
          sourcesHtml += `
            <div class="clinikally-source-card p-3 rounded-xl bg-[#eef3f0]/30 border border-border/50 hover:bg-[#eef3f0]/60 transition-all duration-200 flex items-center gap-3">
              <div class="text-lg text-accent">📚</div>
              <div class="flex-1 min-w-0">
                <a href="${b.url}" target="_blank" class="text-sm font-bold text-accent hover:underline block truncate font-heading">${title}</a>
                <div class="text-xxs text-secondary font-semibold opacity-75">Clinikally Skincare Blog • 2 min read</div>
              </div>
            </div>
          `;
        });
        
        sourcesHtml += `</div></div>`;
        bubble.insertAdjacentHTML('beforeend', sourcesHtml);
      }
      
      // Clean up bracket notations from original markdown
      bubble.innerHTML = bubble.innerHTML
        .replace(/\[Read the full article\]\([^)]+\)/g, '')
        .replace(/\[\[Read the full article\]\([^)]+\)\]/g, '')
        .replace(/\[\s*\]/g, '');
        
      appendSourceAttribution(bubble, rawText);
    }

    // Core formatter function for assistant messages
    function formatAssistantMessage(bubble) {
      if (bubble.dataset.processed === 'true') return;
      
      const rawText = bubble.innerText || bubble.textContent;
      const products = parseProducts(rawText);
      
      if (products.length > 0) {
        console.log("Polishing products block:", products);
        
        // Get introductory text
        const introText = rawText.split(/####\s*\*\*|\*\*Excela|\*\*Re'equil/i)[0].trim();
        let html = '';
        if (introText && introText.length > 10 && !introText.includes('[View Product]')) {
          html += `<p class="mb-4 text-base text-primary font-medium leading-relaxed">${introText.replace(/###|####|\*\*|__/g, '')}</p>`;
        } else {
          html += `<p class="mb-4 text-base text-accent font-bold leading-relaxed">🧴 Recommended Skincare Products for You:</p>`;
        }
        
        // Grid
        html += `<div class="clinikally-product-grid grid grid-cols-1 md:grid-cols-2 gap-4 my-4">`;
        
        products.forEach(p => {
          const badges = getBadgeHtml(p.suitability);
          const benefitsHtml = p.benefits.map(b => `
            <li class="flex items-start gap-1.5 text-xs text-secondary leading-relaxed">
              <span class="text-accent mt-0.5 shrink-0">✓</span>
              <span>${b}</span>
            </li>
          `).join('');
          
          html += `
            <div class="clinikally-product-card p-5 rounded-2xl bg-white border border-border shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between" style="box-shadow: 0 4px 15px rgba(45, 90, 67, 0.03);">
              <div>
                <div class="flex justify-between items-start mb-2.5 gap-2">
                  <h4 class="text-base font-bold text-accent leading-snug font-heading">${p.name}</h4>
                  <span class="text-base font-extrabold text-primary shrink-0">${p.price}</span>
                </div>
                
                <div class="flex flex-wrap gap-1 mb-3.5">
                  ${badges}
                </div>
                
                <div class="mb-4">
                  <div class="text-xs font-bold text-primary mb-1.5 uppercase tracking-wide opacity-80">Key Benefits:</div>
                  <ul class="space-y-1 pl-0 list-none">
                    ${benefitsHtml}
                  </ul>
                </div>
              </div>
              
              <a href="${p.url}" target="_blank" class="w-full text-center py-2.5 px-4 bg-accent hover:bg-accent/90 text-white font-bold rounded-xl text-xs transition-all duration-200 block shadow-sm hover:shadow shadow-accent/25">
                View Product 🛒
              </a>
            </div>
          `;
        });
        
        html += `</div>`;
        
        // Guidance section
        const chooseMatch = rawText.match(/### How to Choose[\s\S]+/i);
        if (chooseMatch) {
          const chooseText = chooseMatch[0]
            .replace(/### How to Choose/i, '')
            .replace(/Sourced from/i, '')
            .replace(/\[Read the full article\]\([^)]+\)/g, '')
            .trim();
            
          if (chooseText) {
            html += `
              <div class="mt-4 p-4 rounded-xl bg-[#eef3f0]/40 border border-border">
                <h5 class="text-sm font-bold text-accent mb-2 font-heading">💡 Dermatologist's Guidance:</h5>
                <p class="text-xs text-secondary leading-relaxed whitespace-pre-line">${chooseText.replace(/\*|\-/g, '•')}</p>
              </div>
            `;
          }
        }
        
        bubble.innerHTML = html;
      }
      
      formatLinksAndSources(bubble, rawText);
      bubble.dataset.processed = 'true';
    }

    // DOM-safe recursive text node typewriter stream simulator
    function streamBubble(div, onComplete) {
      const textNodes = [];
      function collect(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          if (node.nodeValue.trim().length > 0) {
            textNodes.push({
              node: node,
              original: node.nodeValue
            });
          }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          if (node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE' && !node.classList.contains('clinikally-typing-cursor')) {
            for (let child of node.childNodes) {
              collect(child);
            }
          }
        }
      }
      collect(div);

      if (textNodes.length === 0) {
        onComplete();
        return;
      }

      // Clear all text nodes initially to prepare for streaming
      textNodes.forEach(item => {
        item.node.nodeValue = '';
      });

      // Add a premium blinking typing cursor
      const cursor = document.createElement('span');
      cursor.className = 'clinikally-typing-cursor';
      div.appendChild(cursor);

      let nodeIndex = 0;
      let charIndex = 0;
      
      function step() {
        if (nodeIndex >= textNodes.length) {
          cursor.remove();
          onComplete();
          return;
        }
        
        const item = textNodes[nodeIndex];
        const text = item.original;
        
        // Print 3 characters at a time for smooth streaming flow
        const chunkSize = 3; 
        const nextChunk = text.substr(charIndex, chunkSize);
        item.node.nodeValue += nextChunk;
        charIndex += chunkSize;
        
        if (charIndex >= text.length) {
          nodeIndex++;
          charIndex = 0;
        }
        
        // Keep scroll container locked to bottom
        const main = document.querySelector('main');
        if (main) {
          const scrollContainers = Array.from(main.querySelectorAll('.overflow-y-auto, .overflow-y-scroll'));
          if (scrollContainers.length > 0) {
            scrollContainers[0].scrollTop = scrollContainers[0].scrollHeight;
          }
        }
        
        setTimeout(step, 10);
      }
      
      step();
    }

    // Process all message bubbles in container
    function processMessages(chatContainer) {
      injectWelcomeMessage(chatContainer);
      
      // Select all candidate bubbles
      const divs = Array.from(chatContainer.querySelectorAll('div'));
      
      divs.forEach(div => {
        const isBubble = (div.classList.contains('rounded-lg') || div.classList.contains('rounded-xl') || div.classList.contains('rounded-2xl')) && 
                         (div.classList.contains('bg-foreground') || div.classList.contains('bg-foreground_alt') || div.classList.contains('bg-muted') || div.textContent.includes('Sourced from') || div.querySelector('table'));
                          
        if (isBubble && !div.closest('.clinikally-welcome-card')) {
          const isUser = div.classList.contains('bg-primary') || div.closest('.justify-end') || div.closest('.ml-auto');
          
          if (isUser) {
            // Append uploaded image inside the user's bubble if we have one sending!
            if (window.currentSendingImage && !div.querySelector('.clinikally-uploaded-img') && div.dataset.imageProcessed !== 'true') {
              div.dataset.imageProcessed = 'true';
              const imgHtml = `
                <div class="clinikally-uploaded-img mt-2 rounded-lg overflow-hidden border border-white/20 shadow-sm" style="max-width: 200px; max-height: 150px;">
                  <img src="${window.currentSendingImage}" alt="Uploaded skin photo" class="w-full h-full object-cover" />
                </div>
              `;
              div.insertAdjacentHTML('beforeend', imgHtml);
              window.currentSendingImage = null; // consume it!
            }
          } else if (div.dataset.processed !== 'true') {
            // Check if streaming has started or is finished
            if (div.dataset.streamingStarted !== 'true') {
              div.dataset.streamingStarted = 'true';
              
              // Ignore short status updates (e.g. "Querying skincare products...")
              const isStatus = div.textContent.includes('Querying') || 
                               div.textContent.includes('Searching') || 
                               div.textContent.includes('Applying') || 
                               div.textContent.trim().length < 20;
                               
              if (!isStatus) {
                streamBubble(div, () => {
                  formatAssistantMessage(div);
                });
              } else {
                formatAssistantMessage(div);
              }
            }
          }
        }
      });
      
      // No unconditional scroll here! The MutationObserver and streamBubble already handle scroll beautifully.
    }

    // Dynamic Visual Skin Analysis UI Injector
    function initSkinAnalysisUI() {
      const textarea = document.querySelector('textarea');
      if (!textarea) return;

      // Find the input container. We search up the tree from textarea to find a container that has the buttons row.
      let buttonsRow = null;
      let inputBoxContainer = null;
      let currentEl = textarea;
      for (let i = 0; i < 5; i++) {
        if (!currentEl) break;
        
        // Try to locate flex container with buttons
        buttonsRow = currentEl.querySelector('.flex.justify-end, [class*="justify-end"], .flex.items-center.justify-between, .flex.gap-2, [class*="buttons-row"]');
        if (!buttonsRow) {
          const btns = currentEl.querySelectorAll('button');
          for (const btn of btns) {
            const parent = btn.parentElement;
            if (parent) {
              const style = window.getComputedStyle(parent);
              if (style.display === 'flex' || parent.className.includes('flex')) {
                buttonsRow = parent;
                break;
              }
            }
          }
        }
        
        if (buttonsRow) {
          inputBoxContainer = currentEl;
          break;
        }
        currentEl = currentEl.parentElement;
      }

      if (!buttonsRow) {
        // Fallback to any button's parent inside textarea's parent form/div
        const formEl = textarea.closest('form') || textarea.parentElement;
        if (formEl) {
          const btn = formEl.querySelector('button');
          if (btn) {
            buttonsRow = btn.parentElement;
            inputBoxContainer = formEl;
          }
        }
      }

      if (!buttonsRow || !inputBoxContainer) return;

      // 1. Create hidden file input if not exists on the body
      let fileInput = document.getElementById('skin-image-input');
      if (!fileInput) {
        fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.id = 'skin-image-input';
        fileInput.accept = 'image/*';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);
        
        // Listeners for the persistent file input should only be added once!
        fileInput.addEventListener('change', (e) => {
          if (e.target.files && e.target.files[0]) {
            handleSelectedFile(e.target.files[0]);
          }
        });
      }

      // If the upload button is already in this buttons row, return early
      const existingBtn = buttonsRow.querySelector('#skin-image-upload-btn');
      if (existingBtn) {
        // Double check it's positioned correctly at the end of DOM children to prevent React index mismatch mutations
        if (buttonsRow.lastChild !== existingBtn) {
          buttonsRow.appendChild(existingBtn);
        }
        setupMutationObserver(inputBoxContainer);
        return;
      }

      // Clean up any orphaned buttons that might be lying around to avoid duplicates
      const oldBtn = document.getElementById('skin-image-upload-btn');
      if (oldBtn) oldBtn.remove();

      // 2. Create modern circular camera upload button with Kawaii SVG
      const uploadBtn = document.createElement('button');
      uploadBtn.type = 'button';
      uploadBtn.id = 'skin-image-upload-btn';
      uploadBtn.title = 'Upload skin photo for analysis';
      uploadBtn.innerHTML = `
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg" style="transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);">
          <!-- Camera body with soft light pink -->
          <rect x="3" y="9" width="26" height="18" rx="6" fill="#FFB6C1" stroke="#2D5A43" stroke-width="2"/>
          <!-- Lens outer ring -->
          <circle cx="16" cy="18" r="6" fill="#E8F0F2" stroke="#2D5A43" stroke-width="2"/>
          <!-- Lens pupil -->
          <circle cx="16" cy="18" r="3" fill="#2D5A43"/>
          <!-- Sparkle -->
          <circle cx="14.5" cy="16.5" r="0.8" fill="white"/>
          <!-- Flash light -->
          <rect x="8" y="5" width="6" height="4" rx="2" fill="#FFF0F5" stroke="#2D5A43" stroke-width="2"/>
          <!-- Indicator light -->
          <circle cx="23" cy="6" r="2" fill="#FF4500" stroke="#2D5A43" stroke-width="1.5"/>
          <!-- Cheeks -->
          <ellipse cx="8" cy="18" rx="1.8" ry="1" fill="#FF1493" opacity="0.4"/>
          <ellipse cx="24" cy="18" rx="1.8" ry="1" fill="#FF1493" opacity="0.4"/>
          <!-- Smiling mouth -->
          <path d="M 14.5 21.5 C 15.2 22.3 16.8 22.3 17.5 21.5" stroke="#2D5A43" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        </svg>
      `;

      // Premium visual layout placing: Append to the end of the flex buttons row (to avoid React child index mismatch mutations),
      // but display first at the left side using CSS order: -1 and push others to the right using margin-right: auto.
      uploadBtn.style.cssText = 'border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; z-index: 40; padding: 4px; margin-right: auto; margin-left: 4px; order: -1;';
      buttonsRow.appendChild(uploadBtn);

      // Add cute Kawaii interactive hover animations!
      uploadBtn.addEventListener('mouseenter', () => {
        const svg = uploadBtn.querySelector('svg');
        if (svg) svg.style.transform = 'scale(1.2) rotate(-6deg)';
      });
      uploadBtn.addEventListener('mouseleave', () => {
        const svg = uploadBtn.querySelector('svg');
        if (svg) svg.style.transform = 'scale(1) rotate(0deg)';
      });

      // Click trigger
      uploadBtn.addEventListener('click', () => {
        const input = document.getElementById('skin-image-input');
        if (input) input.click();
      });

      // 3. Create preview container div above textarea parent if not exists
      let previewContainer = document.getElementById('skin-image-preview-container');
      if (!previewContainer) {
        previewContainer = document.createElement('div');
        previewContainer.id = 'skin-image-preview-container';
        previewContainer.style.cssText = 'display: none; padding: 4px;';
        
        // Insert it immediately before the inputBoxContainer (or inside it at the top, depending on styling)
        if (inputBoxContainer && inputBoxContainer.parentNode) {
          inputBoxContainer.parentNode.insertBefore(previewContainer, inputBoxContainer);
        }
      }

      // Drag & drop on textarea (bind once using marker)
      if (textarea.dataset.dragListenersBound !== 'true') {
        textarea.dataset.dragListenersBound = 'true';
        
        textarea.addEventListener('dragover', (e) => {
          e.preventDefault();
          textarea.style.borderColor = '#2D5A43';
          textarea.style.backgroundColor = '#f0f7f4';
        });

        textarea.addEventListener('dragleave', (e) => {
          e.preventDefault();
          textarea.style.borderColor = '';
          textarea.style.backgroundColor = '';
        });

        textarea.addEventListener('drop', (e) => {
          e.preventDefault();
          textarea.style.borderColor = '';
          textarea.style.backgroundColor = '';
          if (e.dataTransfer.files && e.dataTransfer.files[0]) {
            handleSelectedFile(e.dataTransfer.files[0]);
          }
        });
      }

      setupMutationObserver(inputBoxContainer);
    }

    // Helper function to set up MutationObserver on the inputBoxContainer
    function setupMutationObserver(container) {
      if (container.dataset.observerAttached === 'true') return;
      container.dataset.observerAttached = 'true';

      const observer = new MutationObserver(() => {
        // Disconnect temporarily to avoid infinite recursion
        observer.disconnect();
        container.dataset.observerAttached = 'false';
        
        // Re-run injection
        initSkinAnalysisUI();
      });

      observer.observe(container, { childList: true, subtree: true });
    }

    // Helper function to handle selected image
    function handleSelectedFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const base64Data = event.target.result;
        window.lastUploadedImageBase64 = base64Data;
        
        let previewContainer = document.getElementById('skin-image-preview-container');
        if (previewContainer) {
          previewContainer.style.display = 'flex';
          previewContainer.className = 'w-full mb-3 flex items-center gap-3 animate-fade-in';
          previewContainer.innerHTML = `
            <div class="relative inline-block rounded-xl border border-border overflow-hidden bg-white p-1 shadow-sm transition-all duration-200" style="width: 80px; height: 80px; box-shadow: 0 4px 12px rgba(45,90,67,0.06);">
              <img src="${base64Data}" alt="Uploaded skin photo" class="w-full h-full object-cover rounded-lg" />
              <button id="clear-skin-image-btn" type="button" class="absolute top-1.5 right-1.5 bg-black/60 hover:bg-black/80 text-white rounded-full flex items-center justify-center transition-colors shadow" style="width: 20px; height: 20px; font-size: 11px; font-weight: bold; border: none; cursor: pointer;">✕</button>
            </div>
            <div class="flex-1 text-xs text-[#2D5A43] font-semibold">
              <span class="flex items-center gap-1">📸 Skin photo uploaded successfully!</span>
              <span class="text-[#556660] block font-normal mt-0.5">Ready for analysis. Send a message to start diagnostic.</span>
            </div>
          `;
          
          document.getElementById('clear-skin-image-btn').addEventListener('click', () => {
            window.lastUploadedImageBase64 = null;
            previewContainer.style.display = 'none';
            previewContainer.innerHTML = '';
            const fileInput = document.getElementById('skin-image-input');
            if (fileInput) fileInput.value = '';
          });
        }
      };
      reader.readAsDataURL(file);
    }

    // Resilient Continuous DOM Scanner Loop
    let activeChatContainer = null;
    let chatMutationObserver = null;

    function runContinuousScanner() {
      const main = document.querySelector('main');
      const textarea = document.querySelector('textarea');
      
      // 1. Dynamic Camera Button Injection
      if (textarea) {
        initSkinAnalysisUI();
      }

      // 2. Chat Scroll Container Hydration and Observation
      if (main) {
        const scrollContainers = Array.from(main.querySelectorAll('.overflow-y-auto, .overflow-y-scroll'));
        if (scrollContainers.length > 0) {
          const currentChatContainer = scrollContainers[0];
          
          // Reconnect observer and re-run formatting when scroll container changes or hydrates
          if (currentChatContainer !== activeChatContainer) {
            console.log("Chat Scroll Container Hydrated/Changed! Re-initializing UI polish...");
            activeChatContainer = currentChatContainer;
            
            if (chatMutationObserver) {
              chatMutationObserver.disconnect();
            }
            
            chatMutationObserver = new MutationObserver((mutations) => {
              processMessages(activeChatContainer);
              
              // Only scroll to bottom on actual child list additions
              const hasAddedNodes = mutations.some(m => m.addedNodes.length > 0);
              if (hasAddedNodes) {
                activeChatContainer.scrollTop = activeChatContainer.scrollHeight;
              }
            });
            chatMutationObserver.observe(activeChatContainer, { childList: true, subtree: true });
            
            processMessages(activeChatContainer);
            // Scroll to bottom on initial load
            activeChatContainer.scrollTop = activeChatContainer.scrollHeight;
          } else {
            // Continuous polling fallback to ensure styles/previews are always up-to-date
            processMessages(activeChatContainer);
          }
        }
      }
    }

    // Start scanner loop immediately with high responsiveness
    setInterval(runContinuousScanner, 500);
    runContinuousScanner();
  })();
</script>
